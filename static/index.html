<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>교육과정 수요조사·예약 시스템</title>
<style>
:root{
  --navy:#16233B; --navy2:#233857; --teal:#0E7C7B; --teal-d:#0A5F5E;
  --bg:#F5F6F3; --card:#FFFFFF; --line:#E3E6E1; --ink:#1D2430; --sub:#6B7280;
  --warn:#C0392B; --warn-bg:#FBEAE8; --ok:#1E8E5A; --ok-bg:#E8F5EE;
  --amber:#B8860B; --amber-bg:#FBF3DF;
  --radius:14px;
  --c0:#4C6FA5; --c1:#0E7C7B; --c2:#B8860B; --c3:#8A4FBE; --c4:#C0392B; --c5:#3E8E7E; --c6:#B5541F; --c7:#5A6B8C;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--navy);}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color:var(--ink); min-height:100vh;
}
#frame{
  max-width:1040px; margin:0 auto; min-height:100vh; background:var(--bg);
  display:flex; flex-direction:column; position:relative; overflow-x:hidden;
}
#topbar{
  background:var(--navy); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px;
  position:sticky; top:0; z-index:20; min-height:26px;
}
#topbar .back{cursor:pointer; font-size:18px; padding:2px 8px 2px 0; opacity:.9;}
#topbar .title{font-size:16px; font-weight:700; flex:1;}
#topbar .action{font-size:13px; color:#BFD8D6; cursor:pointer; white-space:nowrap;}
#view{flex:1; overflow-y:auto; padding-bottom:24px;}
.pad{padding:16px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
.row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.muted{color:var(--sub); font-size:12.5px;}
.h1{font-size:20px; font-weight:800; margin:4px 0 6px;}
.h2{font-size:15px; font-weight:700; margin:0 0 8px;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--teal); color:#fff; border:none; border-radius:10px; padding:11px 16px;
  font-size:14px; font-weight:700; cursor:pointer; text-align:center;
}
.btn:active{background:var(--teal-d);}
.btn.secondary{background:#fff; color:var(--navy); border:1px solid var(--line);}
.btn.ghost{background:transparent; color:var(--teal); padding:8px 6px;}
.btn.danger{background:var(--warn);}
.btn.block{display:flex; width:100%;}
.btn.sm{padding:7px 12px; font-size:12.5px;}
.btn[disabled]{opacity:.4; pointer-events:none;}
input,select,textarea{
  width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 11px; font-size:14px;
  font-family:inherit; background:#fff; color:var(--ink);
}
textarea{resize:vertical; min-height:64px;}
label.field{display:block; font-size:12.5px; font-weight:700; color:var(--sub); margin:12px 0 5px;}
label.field:first-child{margin-top:0;}
.hint{font-size:11.5px; color:var(--sub); margin-top:4px;}
.chip{
  display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:999px;
  padding:6px 12px; font-size:12.5px; font-weight:600; background:#fff; cursor:pointer; user-select:none;
}
.chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}
.chip.on-course{color:#fff; border-color:transparent;}
.list-row{
  display:flex; align-items:center; justify-content:space-between; padding:13px 2px; border-bottom:1px solid var(--line);
  cursor:pointer;
}
.list-row:last-child{border-bottom:none;}
.list-row .name{font-weight:700; font-size:14.5px;}
.list-row .sub{font-size:12px; color:var(--sub); margin-top:2px;}
.list-row .arrow{color:var(--sub); font-size:16px;}
.empty{text-align:center; padding:40px 20px; color:var(--sub); font-size:13.5px;}
.empty .big{font-size:32px; margin-bottom:8px;}
#sheetLayer{position:fixed; inset:0; z-index:100; pointer-events:none;}
.sheet-backdrop{position:absolute; inset:0; background:rgba(10,15,25,.45); opacity:0; transition:opacity .18s;}
.sheet{
  position:absolute; left:0; right:0; bottom:-100%; max-width:560px; margin:0 auto;
  background:#fff; border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  max-height:86%; overflow-y:auto; transition:bottom .22s ease; box-shadow:0 -8px 30px rgba(0,0,0,.25);
}
#sheetLayer.open{pointer-events:auto;}
#sheetLayer.open .sheet-backdrop{opacity:1;}
#sheetLayer.open .sheet{bottom:0;}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.sheet-head .t{font-size:16px; font-weight:800;}
.sheet-close{font-size:20px; color:var(--sub); cursor:pointer; padding:4px 8px;}
.grabber{width:38px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 12px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.three-col{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
.day-toggles{display:flex; gap:6px; flex-wrap:wrap;}
.day-toggles .chip{padding:6px 10px; min-width:36px; text-align:center;}
.tabbar{display:flex; border-bottom:2px solid var(--line); margin-bottom:12px;}
.tabbar .tab{flex:1; text-align:center; padding:10px 4px; font-size:13.5px; font-weight:700; color:var(--sub); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px;}
.tabbar .tab.active{color:var(--teal-d); border-bottom-color:var(--teal-d);}
.toast{
  position:absolute; left:50%; bottom:26px; transform:translateX(-50%); background:var(--navy); color:#fff;
  padding:10px 18px; border-radius:999px; font-size:13px; z-index:200; opacity:0; transition:opacity .2s,bottom .2s;
  pointer-events:none; white-space:nowrap; max-width:88%; text-align:center;
}
.toast.show{opacity:1; bottom:40px;}
.badge{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px;}
.badge.open{background:var(--ok-bg); color:var(--ok);}
.badge.closed{background:var(--warn-bg); color:var(--warn);}
.badge.amber{background:var(--amber-bg); color:var(--amber);}
/* ---- Calendar ---- */
.cal-wrap{background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.cal-scroll{overflow-x:auto;}
.cal-grid{display:grid; position:relative; user-select:none;}
.cal-headrow{display:grid; position:sticky; top:0; background:#fff; z-index:5; border-bottom:1px solid var(--line);}
.cal-headcell{padding:8px 0; text-align:center; font-size:12px; font-weight:800; color:var(--navy); border-left:1px solid var(--line);}
.cal-headcell:first-child{border-left:none;}
.cal-timecol{border-left:none !important;}
.cal-body{display:grid; position:relative;}
.cal-timelabels{display:flex; flex-direction:column;}
.cal-timelabel{font-size:10px; color:var(--sub); text-align:right; padding-right:5px; box-sizing:border-box; border-top:1px solid #F0F1EE;}
.cal-daycol{position:relative; border-left:1px solid var(--line);}
.cal-cell{border-top:1px solid #F0F1EE; box-sizing:border-box;}
.cal-cell:hover{background:#F7FBFA;}
.cal-block{
  position:absolute; left:2px; right:2px; border-radius:7px; padding:3px 6px; color:#fff; font-size:10.5px;
  font-weight:700; overflow:hidden; line-height:1.25; cursor:grab; box-shadow:0 1px 3px rgba(0,0,0,.18);
  touch-action:none;
}
.cal-block .sm{font-weight:600; font-size:9.5px; opacity:.92;}
.cal-block .resize-handle{
  position:absolute; left:0; right:0; bottom:0; height:9px; cursor:ns-resize;
}
.cal-block.dragging{opacity:.85; z-index:50; box-shadow:0 6px 16px rgba(0,0,0,.3);}
.cal-block.split-l{right:50%; margin-right:1px;}
.cal-block.split-r{left:50%; margin-left:1px;}
.cal-block:hover{z-index:40; right:2px !important; left:2px !important; box-shadow:0 4px 14px rgba(0,0,0,.35);}
.cal-block-blocked{
  position:absolute; left:2px; right:2px; border-radius:7px; pointer-events:none; z-index:30;
  background:repeating-linear-gradient(45deg, rgba(192,57,43,.16), rgba(192,57,43,.16) 6px, rgba(192,57,43,.30) 6px, rgba(192,57,43,.30) 12px);
  border:1px dashed rgba(192,57,43,.6);
}
.cal-ua-block{
  position:absolute; left:2px; right:2px; border-radius:7px; z-index:25; cursor:pointer;
  background:repeating-linear-gradient(45deg, rgba(107,114,128,.28), rgba(107,114,128,.28) 6px, rgba(107,114,128,.42) 6px, rgba(107,114,128,.42) 12px);
  border:1px dashed rgba(75,85,99,.7);
  display:flex; align-items:center; justify-content:center; color:#374151; font-size:10.5px; font-weight:700;
}
.cal-ua-block:hover{ background:repeating-linear-gradient(45deg, rgba(192,57,43,.30), rgba(192,57,43,.30) 6px, rgba(192,57,43,.45) 6px, rgba(192,57,43,.45) 12px); }
.cal-ua-busy{
  position:absolute; left:2px; right:2px; border-radius:7px; z-index:24; cursor:default; pointer-events:none;
  background:repeating-linear-gradient(45deg, rgba(76,111,165,.22), rgba(76,111,165,.22) 6px, rgba(76,111,165,.36) 6px, rgba(76,111,165,.36) 12px);
  border:1px dashed rgba(76,111,165,.7);
  display:flex; align-items:center; justify-content:center; color:#2b4a75; font-size:10px; font-weight:700;
}
.palette{display:flex; flex-wrap:wrap; gap:8px;}
.pal-chip{
  padding:8px 12px; border-radius:10px; color:#fff; font-size:12.5px; font-weight:700; cursor:pointer; touch-action:none;
  box-shadow:0 1px 2px rgba(0,0,0,.15);
}
.pal-chip.selected{outline:3px solid var(--navy); outline-offset:2px;}
.drag-ghost{
  position:fixed; pointer-events:none; z-index:500; border-radius:8px; padding:6px 10px; color:#fff; font-size:11.5px;
  font-weight:700; box-shadow:0 8px 18px rgba(0,0,0,.3); opacity:.92;
}
.bottom-fixed{
  position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line); padding:10px 16px;
  display:flex; gap:8px; z-index:15;
}
.heat-cell{position:absolute; border-radius:5px; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; color:#1D2430;}
.legend{display:flex; align-items:center; gap:14px; font-size:11px; color:var(--sub); margin:10px 0;}
.legend .sw{width:12px; height:12px; border-radius:3px; display:inline-block; margin-right:4px; vertical-align:-2px;}
.rank-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
.rank-row:last-child{border-bottom:none;}
.rank-num{width:22px; height:22px; border-radius:50%; background:var(--navy); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.contact-input{display:flex; align-items:center; gap:6px;}
.contact-input input{text-align:center;}
.contact-input span{color:var(--sub); font-weight:700;}
.nav-strip{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
.nav-strip .lbl{font-weight:800; font-size:14.5px;}
.mini-chip-row{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px;}
.mini-chip{flex-shrink:0; padding:6px 11px; border-radius:999px; font-size:11.5px; font-weight:700; background:#fff; border:1px solid var(--line); cursor:pointer;}
.mini-chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}
.pill-count{background:var(--teal); color:#fff; border-radius:999px; padding:1px 8px; font-size:11px; font-weight:800;}
.txt-preview{white-space:pre-wrap; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11.5px; background:#F6F7F5; border:1px solid var(--line); border-radius:9px; padding:12px; line-height:1.55; max-height:300px; overflow-y:auto;}
.lock-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; height:70vh; text-align:center; padding:0 30px; color:var(--sub);}
.lock-screen .big{font-size:40px; margin-bottom:14px;}
.stepper{display:flex; align-items:center; gap:6px; margin-bottom:16px;}
.stepper .dot{flex:1; height:4px; border-radius:2px; background:var(--line);}
.stepper .dot.done{background:var(--teal);}
.footer-note{font-size:11px; color:var(--sub); text-align:center; margin-top:14px; line-height:1.6;}
a{color:var(--teal-d);}
</style>
</head>
<body>
<div id="frame">
  <div id="topbar"></div>
  <div id="view"></div>
  <div id="sheetLayer"><div class="sheet-backdrop"></div><div class="sheet"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
"use strict";
/* ===================== 상수 ===================== */
var DAY_NAMES = ["일","월","화","수","목","금","토"];
var YEAR_OPTS = [
  {v:"1", label:"1년차", num:1},
  {v:"2", label:"2년차", num:2},
  {v:"3", label:"3년차", num:3},
  {v:"4", label:"4년차", num:4},
  {v:"5", label:"5년차", num:5},
  {v:"6~10", label:"6~10년차", num:8},
  {v:"11~15", label:"11~15년차", num:13},
  {v:"16년 이상", label:"16년 이상", num:20}
];
var PALETTE = ["#4C6FA5","#0E7C7B","#B8860B","#8A4FBE","#C0392B","#3E8E7E","#B5541F","#5A6B8C"];
var ROW_MIN = 30;      // 30분 단위
var ROW_H = 26;        // px per 30min row
var IS_STANDALONE = (typeof window.__STANDALONE_SNAPSHOT__ !== "undefined");

/* ===================== 유틸 ===================== */
function uid(prefix){
  return prefix + "_" + Math.random().toString(36).slice(2,8);
}
function esc(s){
  s = (s===undefined||s===null) ? "" : String(s);
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function toMin(hhmm){
  var p = hhmm.split(":"); return (+p[0])*60 + (+p[1]);
}
function fromMin(m){
  m = Math.max(0, m);
  var h = Math.floor(m/60), mm = m%60;
  return (h<10?"0":"")+h+":"+(mm<10?"0":"")+mm;
}
function fmtMoney(n){ return (n||0).toLocaleString("ko-KR"); }
function fmtDate(d){
  if(!d) return "";
  return d;
}
function now(){
  var d = new Date();
  function p(n){return (n<10?"0":"")+n;}
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function colorFor(id, list){
  var idx = list.indexOf(id);
  if(idx<0) idx = Math.abs(hashCode(id)) ;
  return PALETTE[idx % PALETTE.length];
}
function hashCode(s){
  var h=0; for(var i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h|=0; } return h;
}
function digitsOnly(s){ return (s||"").replace(/\D/g,""); }
function overlap(s1,e1,s2,e2){ return s1 < e2 && s2 < e1; }
function clampToRange(v,min,max){ return Math.max(min, Math.min(max, v)); }
function snap30(m){ return Math.round(m/30)*30; }

/* ===== 년차 매칭 (BR-05) ===== */
function courseYearRange(name){
  name = name || "";
  if(/전사원/.test(name)) return {min:0,max:999,all:true};
  var m;
  if((m = name.match(/(\d+)\s*~\s*(\d+)\s*년차/))) return {min:+m[1], max:+m[2]};
  if((m = name.match(/(\d+)\s*년차\s*이상/))) return {min:+m[1], max:999};
  if((m = name.match(/(\d+)\s*년차\s*이하/))) return {min:0, max:+m[1]};
  if(/신입/.test(name)) return {min:0, max:1};
  return {min:0, max:999, all:true}; // 표기 없으면 전원 대상
}
function userYearNum(years){
  var f = YEAR_OPTS.find(function(o){return o.v===years;});
  return f ? f.num : 0;
}
function courseMatchesYear(courseName, years){
  var r = courseYearRange(courseName);
  var n = userYearNum(years);
  return n >= r.min && n <= r.max;
}

/* ===================== 데이터 레이어 (서버 API 기반) ===================== */
function emptyDB(){ return {programs:[], courses:[], slots:[], responses:[], instructors:[]}; }
var DB = IS_STANDALONE ? window.__STANDALONE_SNAPSHOT__ : emptyDB();
var dbLoaded = false;
var publicLoadedPid = null;

function persist(){
  if(IS_STANDALONE) return; // 배포본은 저장하지 않음(메모리 전용)
  fetch("/api/db", {
    method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(DB)
  }).then(function(r){
    if(r.status===401){
      setAdmin(false); dbLoaded=false; DB=emptyDB();
      toast("로그인이 만료되었습니다. 다시 로그인해 주세요");
      go("/admin");
    }
  }).catch(function(){ toast("저장 실패 - 네트워크를 확인해 주세요"); });
}

function getProgram(pid){ return DB.programs.find(function(p){return p.id===pid;}); }
function getCourse(cid){ return DB.courses.find(function(c){return c.id===cid;}); }
function getSlot(sid){ return DB.slots.find(function(s){return s.id===sid;}); }
function coursesOf(pid){ return DB.courses.filter(function(c){return c.programId===pid;}); }
function slotsOfCourse(cid){ return DB.slots.filter(function(s){return s.courseId===cid;}); }
function slotsOfProgram(pid){
  var cids = coursesOf(pid).map(function(c){return c.id;});
  return DB.slots.filter(function(s){return cids.indexOf(s.courseId)>=0;});
}
function responsesOf(pid){ return DB.responses.filter(function(r){return r.programId===pid;}); }

/* 강사 중복 검사 BR-01 : 전체과정 달라도 강사 같으면 충돌 */
function findInstructorConflict(day, start, end, instructor, excludeSlotId){
  if(!instructor) return null;
  for(var i=0;i<DB.slots.length;i++){
    var s = DB.slots[i];
    if(s.id===excludeSlotId) continue;
    if(s.day!==day) continue;
    var c = getCourse(s.courseId);
    if(!c || c.instructor!==instructor) continue;
    if(overlap(toMin(start),toMin(end),toMin(s.start),toMin(s.end))) return {slot:s, course:c};
  }
  return null;
}

/* 강사 개인 불가능 시간 검사 */
function findInstructorUnavailableConflict(day, start, end, instructor){
  if(!instructor) return null;
  var inst = DB.instructors.find(function(i){ return i.name===instructor; });
  if(!inst || !inst.unavailable) return null;
  for(var i=0;i<inst.unavailable.length;i++){
    var u = inst.unavailable[i];
    if(u.day!==day) continue;
    if(overlap(toMin(start),toMin(end),toMin(u.start),toMin(u.end))) return u;
  }
  return null;
}

/* ===================== 라우터 & 공통 UI ===================== */
var ADMIN_KEY = "eduReserve.adminAuth";
function isAdmin(){ return sessionStorage.getItem(ADMIN_KEY)==="1"; }
function setAdmin(v){ sessionStorage.setItem(ADMIN_KEY, v?"1":"0"); }

var state = {
  calDays: [0,1,2,3,4,5,6],
  calCourseFilter: "all", // 'all' or Set
  selectedPaletteCourse: null,
  uaInstructorId: null,
  respTab: "all", // 'all' | 'each'
  respIndex: 0,
  survey: { step:1, name:"", org:"", years:"1", c1:"", c2:"", c3:"", picks:[], memo:"", filter:"my", viewMode:"cal" }
};

function go(hash){ location.hash = hash; }
function currentHash(){ return location.hash.replace(/^#/,"") || "/"; }
/* 브라우저 history.back()는 실제 도착 경로에 따라 어긋날 수 있어(직접 링크 접속,
   새로고침, 수요조사 단계이동 등) 화면 계층 구조를 기준으로 상위 화면을 직접 계산한다 */
function goBack(){
  if(IS_STANDALONE){
    if(state.survey.step>1){ state.survey.step -= 1; render(); }
    return;
  }
  var h = currentHash();
  if(h.indexOf("/s/")===0){
    if(state.survey.step>1){ state.survey.step -= 1; render(); return; }
    return;
  }
  var m;
  if((m = h.match(/^\/admin\/p\/([\w]+)\/(cal|deploy|resp)$/))){ go("/admin/p/"+m[1]); return; }
  if((m = h.match(/^\/admin\/p\/([\w]+)\/c\/([\w]+)$/))){ go("/admin/p/"+m[1]); return; }
  if((m = h.match(/^\/admin\/p\/([\w]+)$/))){ go("/admin"); return; }
  if(h === "/admin/instructors"){ go("/admin"); return; }
  go("/admin");
}

window.addEventListener("hashchange", onRouteChange);
window.addEventListener("DOMContentLoaded", onRouteChange);

function onRouteChange(){
  if(IS_STANDALONE){ render(); return; }
  var h = currentHash();
  var m = h.match(/^\/s\/([\w]+)/);
  if(m){
    var pid = m[1];
    if(publicLoadedPid === pid){ render(); return; }
    fetch("/api/public/"+pid).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        if(data){ DB = {programs:[data.program], courses:data.courses, slots:data.slots, responses:[], instructors:[]}; publicLoadedPid = pid; }
        else { DB = emptyDB(); publicLoadedPid = null; }
        render();
      }).catch(function(){ DB = emptyDB(); render(); });
    return;
  }
  if(dbLoaded){ render(); return; }
  fetch("/api/db").then(function(r){ return r.ok ? r.json() : emptyDB(); })
    .then(function(data){ DB = data; dbLoaded = true; render(); })
    .catch(function(){ DB = emptyDB(); dbLoaded = true; render(); });
}

var toastTimer=null;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2200);
}

function setTopbar(title, opts){
  opts = opts||{};
  var bar = document.getElementById("topbar");
  var back = opts.back ? '<span class="back" data-act="back">‹</span>' : '<span style="width:14px"></span>';
  var action = '';
  if(opts.action){
    var extraAttrs = '';
    if(opts.action.data){
      Object.keys(opts.action.data).forEach(function(k){
        extraAttrs += ' data-'+k+'="'+esc(opts.action.data[k])+'"';
      });
    }
    action = '<span class="action" data-act="'+opts.action.act+'"'+extraAttrs+'>'+esc(opts.action.label)+'</span>';
  }
  bar.innerHTML = back + '<span class="title">'+esc(title)+'</span>' + action;
}

function render(){

  closeSheet();

  if(IS_STANDALONE){
    var m = h.match(/^\/s\/([\w]+)/);

  }

  if(h === "/" || h === ""){ setTopbar("교육과정 수요조사·예약 시스템"); return renderHome(view); }
  if(h === "/admin"){

    setTopbar("전체과정 목록", {action:{act:"logout", label:"로그아웃"}}); return renderProgramList(view);
  }

  if((m = h.match(/^\/admin\/p\/([\w]+)\/deploy$/))) return requireAdmin(function(){ return renderDeploy(m[1], view); });
  if((m = h.match(/^\/admin\/p\/([\w]+)\/resp$/))) return requireAdmin(function(){ return renderResp(m[1], view); });
  if((m = h.match(/^\/admin\/p\/([\w]+)\/c\/([\w]+)$/))) return requireAdmin(function(){ return renderCourseDetail(m[1], m[2], view); });
  if((m = h.match(/^\/admin\/p\/([\w]+)$/))) return requireAdmin(function(){ return renderProgramDetail(m[1], view); });
  if((m = h.match(/^\/s\/([\w]+)/))) return renderSurvey(m[1], view);

  setTopbar("교육과정 수요조사·예약 시스템"); renderHome(view);

function saveSlot(pid, cid, sid){
  var start = document.getElementById("f_start").value, end = document.getElementById("f_end").value;
  var price = +document.getElementById("f_price").value || 0;
  var cap = Math.max(1, +document.getElementById("f_cap").value || 1);
  if(toMin(end) <= toMin(start)){ toast("종료시각은 시작시각보다 늦어야 합니다"); return; }
  var course = getCourse(cid);
  if(!course){ toast("과정명을 먼저 등록해 주세요"); closeSheet(); return; }
  if(sid){
    var conflict = findInstructorConflict(getSlot(sid).day, start, end, course.instructor, sid);
    if(conflict){ toast("강사 '"+course.instructor+"'의 "+DAY_NAMES[conflict.slot.day]+"요일 "+conflict.course.name+"("+conflict.slot.start+"~"+conflict.slot.end+")와 시간이 겹칩니다"); return; }
    var uaConflict = findInstructorUnavailableConflict(getSlot(sid).day, start, end, course.instructor);
    if(uaConflict){ toast("강사 '"+course.instructor+"'의 "+DAY_NAMES[getSlot(sid).day]+"요일 "+uaConflict.start+"~"+uaConflict.end+"은 불가능 시간입니다"); return; }
    var s = getSlot(sid); Object.assign(s, {start:start, end:end, price:price, cap:cap});
    persist(); closeSheet(); toast("저장했습니다"); render(); return;
  }
  var days = Array.prototype.slice.call(document.querySelectorAll("[data-day-toggle].active")).map(function(el){ return +el.getAttribute("data-day-toggle"); });
  if(!days.length){ toast("요일을 1개 이상 선택해 주세요"); return; }
  var intervalEl = document.getElementById("f_interval");
  var interval = intervalEl ? +intervalEl.value : 0;
  var ranges = [];
  if(interval>0){
    for(var m=toMin(start); m<toMin(end); m+=interval){
      ranges.push({start:fromMin(m), end:fromMin(Math.min(m+interval, toMin(end)))});
    }
  } else {
    ranges.push({start:start, end:end});
  }
  var skipped=[], createdCount=0;
  days.forEach(function(d){
    ranges.forEach(function(rg){
      var conflict = findInstructorConflict(d, rg.start, rg.end, course.instructor, null);
      if(conflict){ skipped.push(DAY_NAMES[d]+" "+rg.start+"~"+rg.end); return; }
      var uaConflict = findInstructorUnavailableConflict(d, rg.start, rg.end, course.instructor);
      if(uaConflict){ skipped.push(DAY_NAMES[d]+" "+rg.start+"~"+rg.end+"(불가능시간)"); return; }
      DB.slots.push({id:uid("sl"), courseId:cid, day:d, start:rg.start, end:rg.end, price:price, cap:cap});
      createdCount++;
    });
  });
  persist(); closeSheet();
  var msg = createdCount+"건 등록했습니다";
  if(skipped.length) msg += " (강사 시간 중복으로 "+skipped.length+"건 제외: "+skipped.slice(0,3).join(", ")+(skipped.length>3?" 외":"")+")";
  toast(msg);
  render();
}

/* ---- 그리드 렌더 + 레이아웃 계산 ---- */
function layoutDay(slots){
  var sorted = slots.slice().sort(function(a,b){ return toMin(a.start)-toMin(b.start); });
  var clusters=[], current=[], currentEnd=-1;
  sorted.forEach(function(s){
    var st = toMin(s.start);
    if(current.length && st>=currentEnd){ clusters.push(current); current=[]; currentEnd=-1; }
    current.push(s); currentEnd = Math.max(currentEnd, toMin(s.end));
  });
  if(current.length) clusters.push(current);
  var result=[];
  clusters.forEach(function(cluster){
    var colsEnd=[], colOf={};
    cluster.forEach(function(s){
      var st=toMin(s.start), placed=false;
      for(var i=0;i<colsEnd.length;i++){ if(colsEnd[i]<=st){ colsEnd[i]=toMin(s.end); colOf[s.id]=i; placed=true; break; } }
      if(!placed){ colsEnd.push(toMin(s.end)); colOf[s.id]=colsEnd.length-1; }
    });
    var total = colsEnd.length;
    cluster.forEach(function(s){ result.push(Object.assign({}, s, {col:colOf[s.id], cols:total})); });
  });
  return result;
}

function mountCalendarGrid(pid){
  var p = getProgram(pid);
  var days = state.calDays.slice().sort();
  var calStart = p.calStart*60, calEnd = p.calEnd*60;
  var rows = (calEnd-calStart)/ROW_MIN;
  var mount = document.getElementById("calMount");
  var dayColWidth = 124;
  var timeColWidth = 56;

  var head = '<div style="display:flex;"><div style="width:'+timeColWidth+'px; flex-shrink:0;"></div>' +
    days.map(function(d){ return '<div class="cal-headcell" style="width:'+dayColWidth+'px; flex-shrink:0;">'+DAY_NAMES[d]+'</div>'; }).join("") + '</div>';

  var timeLabels = '';
  for(var m=calStart, i=0; m<calEnd; m+=ROW_MIN, i++){
    timeLabels += '<div class="cal-timelabel" style="height:'+ROW_H+'px; line-height:'+ROW_H+'px;">'+(m%60===0?fromMin(m):'')+'</div>';
  }

  var filterOn = state.calCourseFilter;
  var uaInst = state.uaInstructorId ? DB.instructors.find(function(i){ return i.id===state.uaInstructorId; }) : null;
  var dayCols = days.map(function(d){
    var daySlots = DB.slots.filter(function(s){
      if(s.day!==d) return false;
      if(filterOn!=="all" && filterOn.indexOf(s.courseId)<0) return false;
      var c = getCourse(s.courseId); return c && c.programId===pid;
    });
    var laidOut = layoutDay(daySlots);
    var cellsHtml = '';
    for(var mm=calStart; mm<calEnd; mm+=ROW_MIN){ cellsHtml += '<div class="cal-cell" data-act="calCellTap" data-day="'+d+'" data-min="'+mm+'" style="height:'+ROW_H+'px;"></div>'; }
    var blocksHtml = laidOut.map(function(s){
      var course = getCourse(s.courseId);
      var top = (toMin(s.start)-calStart)/ROW_MIN*ROW_H;
      var h = Math.max(ROW_H*0.7,(toMin(s.end)-toMin(s.start))/ROW_MIN*ROW_H);
      var w = 100/s.cols, left = s.col*w;
      var cnt = respCountForSlot(s.id);
      var titleTxt = course.name+" · 강사 "+course.instructor+" · "+DAY_NAMES[d]+" "+s.start+"~"+s.end+" · "+cnt+"명";
      return '<div class="cal-block" data-slot-id="'+s.id+'" data-day="'+d+'" title="'+esc(titleTxt)+'" style="top:'+top+'px; height:'+h+'px; left:calc('+left+'% + 2px); width:calc('+w+'% - 4px); background:'+course.color+';">' +
        '<div>'+esc(course.name)+'</div><div class="sm">'+s.start+'~'+s.end+' · '+cnt+'명</div>' +
        '<div class="resize-handle" data-resize="'+s.id+'"></div></div>';
    }).join("");
    var uaBlocksHtml = '';
    if(uaInst && uaInst.unavailable){
      uaBlocksHtml = uaInst.unavailable.filter(function(u){return u.day===d;}).map(function(u){
        var top = (toMin(u.start)-calStart)/ROW_MIN*ROW_H;
        var h = Math.max(ROW_H*0.7,(toMin(u.end)-toMin(u.start))/ROW_MIN*ROW_H);
        return '<div class="cal-ua-block" data-ua-iid="'+uaInst.id+'" data-ua-day="'+u.day+'" data-ua-start="'+u.start+'" data-ua-end="'+u.end+'" title="탭하면 해제됩니다" style="top:'+top+'px; height:'+h+'px;">🚫 '+u.start+'~'+u.end+'</div>';
      }).join("");
    }
    // 다른 전체과정에서 이미 이 강사가 수업 중인 시간(이 캘린더엔 원래 안 보이는 슬롯)도 불가능 시간과 함께 표시
    var otherBusyHtml = '';
    if(uaInst){
      otherBusyHtml = DB.slots.filter(function(s){
        if(s.day!==d) return false;
        var c = getCourse(s.courseId);
        return c && c.instructor===uaInst.name && c.programId!==pid;
      }).map(function(s){
        var c = getCourse(s.courseId);
        var top = (toMin(s.start)-calStart)/ROW_MIN*ROW_H;
        var h = Math.max(ROW_H*0.7,(toMin(s.end)-toMin(s.start))/ROW_MIN*ROW_H);
        var titleTxt = "다른 전체과정 수업 중 · "+c.name+" "+s.start+"~"+s.end;
        return '<div class="cal-ua-busy" title="'+esc(titleTxt)+'" style="top:'+top+'px; height:'+h+'px;">🚫 '+s.start+'~'+s.end+' (타과정)</div>';
      }).join("");
    }
    return '<div class="cal-daycol" data-day="'+d+'" style="width:'+dayColWidth+'px; flex-shrink:0; height:'+(rows*ROW_H)+'px;">'+cellsHtml+blocksHtml+uaBlocksHtml+otherBusyHtml+'</div>';
  }).join("");

  mount.innerHTML =
    '<div class="cal-wrap"><div class="cal-scroll">' + head +
    '<div style="display:flex;">' +
      '<div class="cal-timelabels" style="width:'+timeColWidth+'px; flex-shrink:0;">'+timeLabels+'</div>' +
      '<div style="display:flex; position:relative;">'+dayCols+'</div>' +
    '</div></div></div>';

  attachCalGridHandlers(pid, calStart, calEnd, dayColWidth, days);
}
function respCountForSlot(sid){
  return DB.responses.filter(function(r){ return r.picks.indexOf(sid)>=0; }).length;
}

/* 드래그/리사이즈 중 해당 강사가 이미 차있는 시간대를 배경으로 표시(BR-01 사전 안내) */
function showInstructorBlockedZones(instructor, excludeSlotId, calStart, calEnd){
  if(!instructor) return;
  var inst = DB.instructors.find(function(i){ return i.name===instructor; });
  document.querySelectorAll(".cal-daycol[data-day]").forEach(function(col){
    var day = +col.getAttribute("data-day");
    function addOverlay(top, h, titleTxt){
      var ov = document.createElement("div");
      ov.className = "cal-block-blocked";
      ov.style.top = top+"px"; ov.style.height = h+"px";
      ov.title = titleTxt;
      col.appendChild(ov);
    }
    DB.slots.forEach(function(s){
      if(s.id===excludeSlotId) return;
      if(s.day!==day) return;
      var c = getCourse(s.courseId);
      if(!c || c.instructor!==instructor) return;
      var top = (toMin(s.start)-calStart)/ROW_MIN*ROW_H;
      var h = Math.max(ROW_H*0.7,(toMin(s.end)-toMin(s.start))/ROW_MIN*ROW_H);
      addOverlay(top, h, "강사 "+instructor+" 이동 불가 · "+c.name+" "+s.start+"~"+s.end);
    });
    if(inst && inst.unavailable){
      inst.unavailable.forEach(function(u){
        if(u.day!==day) return;
        var top = (toMin(u.start)-calStart)/ROW_MIN*ROW_H;
        var h = Math.max(ROW_H*0.7,(toMin(u.end)-toMin(u.start))/ROW_MIN*ROW_H);
        addOverlay(top, h, "강사 "+instructor+" 불가능 시간 · "+u.start+"~"+u.end);
      });
    }
  });
}
function clearInstructorBlockedZones(){
  document.querySelectorAll(".cal-block-blocked").forEach(function(el){ el.remove(); });
}

/* ---- 캘린더 포인터 인터랙션 ---- */
function attachCalGridHandlers(pid, calStart, calEnd, dayColWidth, days){
  var p = getProgram(pid);

  // 1) 빈칸 탭 배치 (과정 배치 또는 강사 불가능시간 표시)
  document.querySelectorAll('[data-act="calCellTap"]').forEach(function(cell){
    cell.addEventListener("click", function(){
      var day = +cell.getAttribute("data-day");
      var startMin = +cell.getAttribute("data-min");
      if(state.uaInstructorId){ toggleUnavailableCell(state.uaInstructorId, day, startMin); mountCalendarGrid(pid); return; }
      if(!state.selectedPaletteCourse){ toast("먼저 팔레트에서 과정을 선택하거나, 강사 불가능 시간을 선택해 주세요"); return; }
      placeNewSlot(pid, day, startMin, state.selectedPaletteCourse);
    });
  });

  // 1b) 불가능 시간 블록 탭 → 해제
  document.querySelectorAll(".cal-ua-block").forEach(function(block){
    block.addEventListener("click", function(ev){
      ev.stopPropagation();
      toggleUnavailableCell(block.getAttribute("data-ua-iid"), +block.getAttribute("data-ua-day"),
        toMin(block.getAttribute("data-ua-start")), toMin(block.getAttribute("data-ua-end")));
      mountCalendarGrid(pid);
    });
  });

  // 2) 블록 드래그(이동) & 탭(수정) & 리사이즈
  document.querySelectorAll(".cal-block").forEach(function(block){
    var sid = block.getAttribute("data-slot-id");
    var moved = false, dragging=false, startX=0, startY=0, origLeft=0, origTop=0;
    block.addEventListener("pointerdown", function(ev){
      if(ev.target.hasAttribute("data-resize")) return;
      ev.stopPropagation();
      startX = ev.clientX; startY = ev.clientY; moved=false; dragging=true;
      origTop = parseFloat(block.style.top);
      block.setPointerCapture(ev.pointerId);
      block.classList.add("dragging");
      var course0 = getCourse(getSlot(sid).courseId);
      showInstructorBlockedZones(course0.instructor, sid, calStart, calEnd);
    });
    block.addEventListener("pointermove", function(ev){
      if(!dragging) return;
      var dx = ev.clientX-startX, dy = ev.clientY-startY;
      if(Math.abs(dx)>4 || Math.abs(dy)>4) moved=true;
      if(moved){ block.style.transform = "translate("+dx+"px,"+dy+"px)"; }
    });
    block.addEventListener("pointerup", function(ev){
      dragging=false; block.classList.remove("dragging");
      clearInstructorBlockedZones();
      if(!moved){ block.style.transform=""; openSlotSheet(pid, getCourse(getSlot(sid).courseId).id, sid); return; }
      var dx = ev.clientX-startX, dy = ev.clientY-startY;
      block.style.transform="";
      // 대상 day 계산: 드롭 지점에서 day column 찾기
      var el = document.elementFromPoint(ev.clientX, ev.clientY);
      var col = el ? el.closest(".cal-daycol") : null;
      var s = getSlot(sid);
      var newDay = col ? +col.getAttribute("data-day") : s.day;
      var deltaMin = snap30(Math.round(dy/ROW_H*ROW_MIN));
      var dur = toMin(s.end)-toMin(s.start);
      var newStart = clampToRange(toMin(s.start)+deltaMin, calStart, calEnd-dur);
      var newEnd = newStart+dur;
      commitSlotMove(pid, sid, newDay, fromMin(newStart), fromMin(newEnd));
    });
  });

  // 3) 리사이즈
  document.querySelectorAll("[data-resize]").forEach(function(handle){
    var sid = handle.getAttribute("data-resize");
    var dragging=false, startY=0, origH=0;
    handle.addEventListener("pointerdown", function(ev){
      ev.stopPropagation(); dragging=true; startY=ev.clientY;
      origH = parseFloat(handle.parentElement.style.height);
      handle.setPointerCapture(ev.pointerId);
      var course0 = getCourse(getSlot(sid).courseId);
      showInstructorBlockedZones(course0.instructor, sid, calStart, calEnd);
    });
    handle.addEventListener("pointermove", function(ev){
      if(!dragging) return;
      var dy = ev.clientY-startY;
      var newH = Math.max(ROW_H, origH+dy);
      handle.parentElement.style.height = newH+"px";
    });
    handle.addEventListener("pointerup", function(ev){
      dragging=false;
      clearInstructorBlockedZones();
      var dy = ev.clientY-startY;
      var deltaMin = snap30(Math.round(dy/ROW_H*ROW_MIN));
      var s = getSlot(sid);
      var newEndMin = clampToRange(toMin(s.end)+deltaMin, toMin(s.start)+ROW_MIN, calEnd);
      commitSlotMove(pid, sid, s.day, s.start, fromMin(newEndMin));
    });
  });
}

/* 캘린더에서 직접 탭해 강사 불가능 시간을 표시/해제 (30분 단위) */
function toggleUnavailableCell(iid, day, startMin, endMin){
  var inst = DB.instructors.find(function(i){ return i.id===iid; });
  if(!inst) return;
  if(!inst.unavailable) inst.unavailable = [];
  var start = fromMin(startMin), end = fromMin(endMin!=null ? endMin : startMin+30);
  var idx = inst.unavailable.findIndex(function(u){ return u.day===day && u.start===start && u.end===end; });
  if(idx>=0){ inst.unavailable.splice(idx,1); persist(); toast("불가능 시간을 해제했습니다"); }
  else { inst.unavailable.push({day:day, start:start, end:end}); persist(); toast("불가능 시간으로 표시했습니다"); }
}
function placeNewSlot(pid, day, startMin, cid){
  var course = getCourse(cid);
  var p = getProgram(pid);
  var endMin = Math.min(startMin+60, p.calEnd*60);
  var conflict = findInstructorConflict(day, fromMin(startMin), fromMin(endMin), course.instructor, null);
  if(conflict){ toast("강사 '"+course.instructor+"'의 "+DAY_NAMES[conflict.slot.day]+"요일 "+conflict.course.name+"와 시간이 겹쳐 배치할 수 없습니다"); return; }
  var uaConflict = findInstructorUnavailableConflict(day, fromMin(startMin), fromMin(endMin), course.instructor);
  if(uaConflict){ toast("강사 '"+course.instructor+"'의 "+DAY_NAMES[day]+"요일 "+uaConflict.start+"~"+uaConflict.end+"은 불가능 시간으로 설정되어 있어 배치할 수 없습니다"); return; }
  DB.slots.push({id:uid("sl"), courseId:cid, day:day, start:fromMin(startMin), end:fromMin(endMin), price:0, cap:20});
  persist(); toast("배치했습니다 · 세부정보를 입력해 주세요");
  mountCalendarGrid(pid);
}
function commitSlotMove(pid, sid, newDay, newStart, newEnd){
  var s = getSlot(sid);
  var course = getCourse(s.courseId);
  var conflict = findInstructorConflict(newDay, newStart, newEnd, course.instructor, sid);
  if(conflict){
    toast("강사 '"+course.instructor+"'의 "+DAY_NAMES[conflict.slot.day]+"요일 "+conflict.course.name+"("+conflict.slot.start+"~"+conflict.slot.end+")와 겹쳐 원래대로 되돌렸습니다");
    mountCalendarGrid(pid); return;
  }
  var uaConflict = findInstructorUnavailableConflict(newDay, newStart, newEnd, course.instructor);
  if(uaConflict){
    toast("강사 '"+course.instructor+"'의 "+DAY_NAMES[newDay]+"요일 "+uaConflict.start+"~"+uaConflict.end+"은 불가능 시간이라 원래대로 되돌렸습니다");
    mountCalendarGrid(pid); return;
  }
  s.day=newDay; s.start=newStart; s.end=newEnd;
  persist(); toast("저장했습니다");
  mountCalendarGrid(pid);
}

function startPaletteDrag(ev, cid, pid){
  var course = getCourse(cid);
  var p = getProgram(pid);
  var ghost = document.createElement("div");
  ghost.className = "drag-ghost"; ghost.style.background = course.color; ghost.textContent = course.name;
  document.body.appendChild(ghost);
  moveGhost(ev);
  showInstructorBlockedZones(course.instructor, null, p.calStart*60, p.calEnd*60);
  function moveGhost(e){ ghost.style.left=(e.clientX+8)+"px"; ghost.style.top=(e.clientY+8)+"px"; }
  function onMove(e){ moveGhost(e); }
  function onUp(e){
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    clearInstructorBlockedZones();
    ghost.remove();
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var cell = el ? el.closest('[data-act="calCellTap"]') : null;
    if(cell){
      placeNewSlot(pid, +cell.getAttribute("data-day"), +cell.getAttribute("data-min"), cid);
    }
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
}

}
function copyUrl(url){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ toast("URL을 복사했습니다"); }, function(){ toast("복사에 실패했습니다. 길게 눌러 직접 복사해 주세요"); });
  } else { toast("이 환경에서는 자동 복사가 지원되지 않습니다"); }

function exportStandaloneHTML(pid){
  var p = getProgram(pid);
  if(coursesOf(pid).length===0 || slotsOfProgram(pid).length===0){
    if(!confirm("과정명 또는 시간대가 비어 있습니다. 그래도 내보낼까요?")) return;
  }
  var snapshot = { programs:[p], courses:coursesOf(pid), slots:slotsOfProgram(pid), responses:[] };
  var html = document.documentElement.outerHTML;
  var snapScript = '<script>window.__STANDALONE_SNAPSHOT__=' + JSON.stringify(snapshot).replace(/</g,"\\u003c") + ';<' + '/script>';
  var idx = html.indexOf("<script>");
  html = html.slice(0, idx) + snapScript + html.slice(idx);
  var blob = new Blob([html], {type:"text/html;charset=utf-8"});
  var a = document.createElement("a");
  var safeName = (p.name||"수요조사").replace(/[\\\/:*?"<>|]/g,"_");
  a.href = URL.createObjectURL(blob);
  a.download = safeName + "_배포본.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  toast("배포본 HTML을 내려받았습니다");
}

function setRespTab(pid, tab){ state.respTab = tab; state.respIndex=0; render(); }

function renderRespAll(pid){
  var p = getProgram(pid);
  var responses = responsesOf(pid);
  var slots = slotsOfProgram(pid);
  var over = slots.filter(function(s){ return respCountForSlot(s.id) > s.cap; }).length;
  var none = slots.filter(function(s){ return respCountForSlot(s.id) === 0; }).length;
  var days = Array.from(new Set(slots.map(function(s){return s.day;}))).sort();
  if(!days.length) days=[0,1,2,3,4,5,6];

  var mount = document.getElementById("respBody");
  var calStart = p.calStart*60, calEnd = p.calEnd*60;
  var rows = (calEnd-calStart)/ROW_MIN;
  var dayColWidth=124, timeColWidth=56;
  var head = '<div style="display:flex;"><div style="width:'+timeColWidth+'px; flex-shrink:0;"></div>' +
    days.map(function(d){ return '<div class="cal-headcell" style="width:'+dayColWidth+'px; flex-shrink:0;">'+DAY_NAMES[d]+'</div>'; }).join("") + '</div>';
  var timeLabels='';
  for(var m=calStart;m<calEnd;m+=ROW_MIN){ timeLabels += '<div class="cal-timelabel" style="height:'+ROW_H+'px; line-height:'+ROW_H+'px;">'+(m%60===0?fromMin(m):'')+'</div>'; }
  var dayCols = days.map(function(d){
    var daySlots = slots.filter(function(s){return s.day===d;});
    var laid = layoutDay(daySlots);
    var blocks = laid.map(function(s){
      var top=(toMin(s.start)-calStart)/ROW_MIN*ROW_H, h=Math.max(ROW_H*0.7,(toMin(s.end)-toMin(s.start))/ROW_MIN*ROW_H);
      var w=100/s.cols, left=s.col*w;
      var cnt = respCountForSlot(s.id);
      var hc = heatColor(cnt, s.cap);
      var course = getCourse(s.courseId);
      var titleTxt = course.name+" · 강사 "+course.instructor+" · "+DAY_NAMES[d]+" "+s.start+"~"+s.end+" · "+cnt+"/"+s.cap+"명";
      return '<div class="heat-cell" title="'+esc(titleTxt)+'" style="top:'+top+'px; height:'+h+'px; left:calc('+left+'% + 2px); width:calc('+w+'% - 4px); background:'+hc.bg+'; color:'+hc.fg+'; flex-direction:column; padding:2px;">' +
        '<div style="font-size:9px; font-weight:600; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;">'+esc(course.name.split(" (")[0])+'</div>' +
        '<div>'+cnt+'/'+s.cap+(cnt>s.cap?' ★':'')+'</div></div>';
    }).join("");
    return '<div class="cal-daycol" style="width:'+dayColWidth+'px; flex-shrink:0; height:'+(rows*ROW_H)+'px; position:relative;">'+blocks+'</div>';
  }).join("");

function heatColor(count, cap){
  if(count===0) return {bg:"#fff", fg:"#9CA3AF"};
  var ratio = cap ? count/cap : 1;
  if(ratio>1) return {bg:"#F6D7D2", fg:"#B23227"};
  var light = 82 - Math.min(ratio,1)*32;
  return {bg:"hsl(160,45%,"+light+"%)", fg:"#0F2E22"};
}

/* ===================== TXT 등록 파싱 (I-03/I-04 인식, BR-06 중복처리) ===================== */
function mapYearsField(raw){
  raw = (raw||"").trim();
  var exact = YEAR_OPTS.find(function(o){return o.v===raw;});
  if(exact) return exact.v;
  var n = parseInt(raw,10);
  if(isNaN(n)) return raw;
  if(n<=5) return String(n);
  if(n<=10) return "6~10";
  if(n<=15) return "11~15";
  return "16년 이상";
}
function parseTxtBatch(text){
  var anchors = [], re = /\[이름\]/g, m;
  while((m = re.exec(text))){ anchors.push(m.index); }
  if(!anchors.length) return [];
  return anchors.map(function(pos,i){
    var block = text.slice(pos, i+1<anchors.length ? findNextAnchorBoundary(text, anchors, i) : text.length);
    return parseOneTxtBlock(block);
  });
}
function findNextAnchorBoundary(text, anchors, i){
  // 다음 레코드는 다음 앵커 이전, 단 "=== 응답서 끝 ==="/"=== 요약 끝 ===" 종료마커가 먼저 나오면 그 지점까지만
  var next = anchors[i+1];
  var endMarker = text.slice(anchors[i], next).search(/===\s*(응답서|요약)\s*끝\s*===/);
  if(endMarker>=0) return anchors[i] + endMarker;
  return next;
}
function parseOneTxtBlock(block){
  function grab(tag){ var mm = block.match(new RegExp("\\["+tag+"\\]\\s*([^\\n\\r]*)")); return mm ? mm[1].trim() : ""; }
  var programName = grab("과정");
  var name = grab("이름");
  var org = grab("소속");
  var years = grab("년차");
  var contact = digitsOnly(grab("연락처"));
  var memo = grab("요청");
  var note = grab("담당자메모");
  var picksRaw = [];
  var lineRe = /\d+\)\s*([^|]+?)\s*\|\s*([일월화수목금토])\s*\|\s*(\d{1,2}:\d{2})\s*~\s*(\d{1,2}:\d{2})\s*\|\s*([\d,]+)\s*원(?:\s*\|\s*(sl_[a-z0-9]+))?/g;
  var lm;
  while((lm = lineRe.exec(block))){
    picksRaw.push({courseNamePart: lm[1].trim(), day: lm[2], start: lm[3], end: lm[4], price:+lm[5].replace(/,/g,""), slotId: lm[6]||null});
  }
  return {programName:programName, name:name, org:org, years: mapYearsField(years), contact:contact, memo:memo, note:note, picksRaw:picksRaw};
}
function matchSlotForPick(pid, pick){
  if(pick.slotId){ var s = getSlot(pick.slotId); if(s && getCourse(s.courseId) && getCourse(s.courseId).programId===pid) return s; }
  var dayIdx = DAY_NAMES.indexOf(pick.day);
  var candidates = slotsOfProgram(pid).filter(function(s){ return s.day===dayIdx && s.start===pick.start; });
  if(!candidates.length) return null;
  var baseName = pick.courseNamePart.split(" (")[0].trim();
  var matched = candidates.find(function(s){
    var cn = getCourse(s.courseId).name.split(" (")[0].trim();
    return cn===baseName || cn.indexOf(baseName)>=0 || baseName.indexOf(cn)>=0;
  });
  return matched || (candidates.length===1 ? candidates[0] : null);
}
function registerTxtBatch(pid){
  var raw = document.getElementById("txtPasteArea").value;
  if(!raw.trim()){ toast("붙여넣을 텍스트가 없습니다"); return; }
  var p = getProgram(pid);
  var blocks = parseTxtBatch(raw);
  if(!blocks.length){ toast("인식 가능한 응답서 형식을 찾지 못했습니다"); return; }
  var newCount=0, updateCount=0, excluded=0, unmatchedLines=0;
  blocks.forEach(function(b){
    if(!b.name || !b.contact){ excluded++; return; }
    if(b.programName && b.programName.trim() && b.programName.trim()!==p.name.trim()){ excluded++; return; }
    var picks = [];
    b.picksRaw.forEach(function(pk){
      var s = matchSlotForPick(pid, pk);
      if(s) picks.push(s.id); else unmatchedLines++;
    });
    var key = pid+"|"+b.name.trim()+"|"+b.contact;
    var existing = DB.responses.find(function(r){ return (r.programId+"|"+r.name.trim()+"|"+digitsOnly(r.contact))===key; });
    if(existing){
      DB.responses = DB.responses.filter(function(r){return r.id!==existing.id;});
      updateCount++;
    } else newCount++;
    DB.responses.push({
      id:uid("rs"), programId:pid, name:b.name.trim(), org:b.org, years:b.years, contact:b.contact,
      memo:b.memo, picks:picks, at:now(), note:b.note||"", noteAt:b.note?now():"", src:"txt"
    });
  });
  persist(); closeSheet();
  toast("신규 "+newCount+"명 / 갱신 "+updateCount+"명 / 제외 "+excluded+"건"+(unmatchedLines?(" / 미매칭 "+unmatchedLines+"건"):""));
  render();
}

    '<textarea id="txtPasteArea" placeholder="=== 교육 수요조사 응답서 ===&#10;[이름] 홍길동 ..." style="min-height:180px;"></textarea>';

/* ===================== I-06 CSV 내보내기 ===================== */
function exportCSV(pid){
  var p = getProgram(pid);
  var header = ["응답일시","이름","소속","년차","연락처","과정명","강사","대상년차","요일","시작","종료","금액","참여자요청","담당자메모"];
  var rows = [header];
  responsesOf(pid).forEach(function(r){
    var picks = r.picks.map(getSlot).filter(Boolean);
    if(!picks.length){
      rows.push([r.at,r.name,r.org,r.years,fmtContact(r.contact),"","","","","","","",r.memo||"",r.note||""]);
      return;
    }
    picks.forEach(function(s){
      var c = getCourse(s.courseId);
      var yearRange = courseYearRange(c.name);
      var yearLabel = yearRange.all ? "전사원" : (yearRange.min+"~"+yearRange.max+"년차");
      rows.push([r.at, r.name, r.org, r.years, fmtContact(r.contact), c.name, c.instructor, yearLabel, DAY_NAMES[s.day], s.start, s.end, s.price, r.memo||"", r.note||""]);
    });
  });
  var csv = rows.map(function(row){
    return row.map(function(v){
      v = String(v===undefined||v===null?"":v);
      if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
      return v;
    }).join(",");
  }).join("\r\n");
  var blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = (p.name||"수요조사")+"_응답.csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
  toast("CSV를 내려받았습니다");
}

/* ===================== SC-11/12/13 수요조사 (대상자) ===================== */
function ensureSurveyState(pid){
  if(state.survey.pid !== pid){
    state.survey = {pid:pid, step:1, name:"", org:"", years:"1", c1:"010", c2:"", c3:"", picks:[], memo:"", filter:"my", viewMode:"cal", submitted:null};
  }
}
function renderSurvey(pid, view){
  var p = getProgram(pid);
  if(!p){
    setTopbar("수요조사");
    view.innerHTML = '<div class="lock-screen"><div class="big">🔍</div>존재하지 않는 수요조사입니다.</div>';
    return;
  }
  ensureSurveyState(pid);
  if(!p.surveyOpen && !IS_STANDALONE){
    setTopbar(p.name);
    view.innerHTML = '<div class="lock-screen"><div class="big">🔒</div><div style="font-weight:700; margin-bottom:6px;">수요조사가 마감되었습니다</div>문의사항은 담당자('+esc(p.owner||"-")+', '+esc(p.ownerTel||"-")+')에게 연락해 주세요.</div>';
    return;
  }
  var sv = state.survey;
  if(sv.step===1) return renderSurveyStep1(p, view);
  if(sv.step===2) return renderSurveyStep2(p, view);
  return renderSurveyStep3(p, view);
}

function renderSurveyStep1(p, view){
  setTopbar(p.name);
  var sv = state.survey;
  var yearOptions = YEAR_OPTS.map(function(o){ return '<option value="'+o.v+'"'+(sv.years===o.v?" selected":"")+'>'+o.label+'</option>'; }).join("");
  view.innerHTML =
  '<div class="pad">' +
    '<div class="stepper"><div class="dot done"></div><div class="dot"></div><div class="dot"></div></div>' +
    (p.desc ? '<div class="card" style="background:var(--navy); color:#fff; border:none;"><div style="font-size:12.5px; line-height:1.6;">'+esc(p.desc)+'</div></div>' : '') +
    '<div class="card">' +
      '<div class="h2">참여자 정보</div>' +
      '<label class="field">이름 *</label><input id="sv_name" value="'+esc(sv.name)+'" placeholder="이름">' +
      '<label class="field">소속 *</label><input id="sv_org" value="'+esc(sv.org)+'" placeholder="예: 디지털플랫폼사업부">' +
      '<label class="field">년차 *</label><select id="sv_years">'+yearOptions+'</select>' +
      '<label class="field">연락처 *</label>' +
      '<div class="contact-input">' +
        '<input id="sv_c1" value="010" maxlength="3" style="flex:0 0 56px; text-align:center;" readonly>' +
        '<span>-</span><input id="sv_c2" value="'+esc(sv.c2)+'" maxlength="4" inputmode="numeric" placeholder="0000" style="flex:1;">' +
        '<span>-</span><input id="sv_c3" value="'+esc(sv.c3)+'" maxlength="4" inputmode="numeric" placeholder="0000" style="flex:1;">' +
      '</div>' +
    '</div>' +
    '<button class="btn block" data-act="surveyStep1Next" data-pid="'+p.id+'">다음</button>' +
  '</div>';
  var c2 = document.getElementById("sv_c2"), c3 = document.getElementById("sv_c3");
  c2.addEventListener("input", function(){ c2.value = digitsOnly(c2.value).slice(0,4); if(c2.value.length===4) c3.focus(); });
  c3.addEventListener("input", function(){ c3.value = digitsOnly(c3.value).slice(0,4); });
}
function surveyStep1Next(pid){
  var sv = state.survey;
  sv.name = document.getElementById("sv_name").value.trim();
  sv.org = document.getElementById("sv_org").value.trim();
  sv.years = document.getElementById("sv_years").value;
  sv.c2 = digitsOnly(document.getElementById("sv_c2").value);
  sv.c3 = digitsOnly(document.getElementById("sv_c3").value);
  if(!sv.name){ toast("이름을 입력해 주세요"); return; }
  if(!sv.org){ toast("소속을 입력해 주세요"); document.getElementById("sv_org").focus(); return; }
  if(sv.c2.length!==4){ toast("연락처 가운데 4자리를 입력해 주세요"); document.getElementById("sv_c2").focus(); return; }
  if(sv.c3.length!==4){ toast("연락처 마지막 4자리를 입력해 주세요"); document.getElementById("sv_c3").focus(); return; }
  sv.step = 2; sv.filter = "my"; render();
}

function renderSurveyStep2(p, view){
  setTopbar(p.name, {back:true});
  var sv = state.survey;
  var allSlots = slotsOfProgram(p.id);
  var filtered = allSlots.filter(function(s){
    var c = getCourse(s.courseId);
    if(sv.filter==="my") return courseMatchesYear(c.name, sv.years);
    if(sv.filter==="picked") return sv.picks.indexOf(s.id)>=0;
    return true;
  });
  var days = Array.from(new Set(filtered.map(function(s){return s.day;}))).sort();
  if(!days.length) days=[0,1,2,3,4,5,6];

  var filterChips = [
    {k:"my", label:"내 년차"}, {k:"all", label:"전체"}, {k:"picked", label:"선택한 것만 ("+sv.picks.length+")"}
  ].map(function(f){ return '<span class="chip'+(sv.filter===f.k?" active":"")+'" data-act="surveySetFilter" data-f="'+f.k+'">'+f.label+'</span>'; }).join("");

  var tabHtml = '<div class="tabbar"><div class="tab'+(sv.viewMode==="cal"?" active":"")+'" data-act="surveySetView" data-v="cal">🗓 캘린더</div><div class="tab'+(sv.viewMode==="list"?" active":"")+'" data-act="surveySetView" data-v="list">☰ 목록</div></div>';

  var body;
  if(sv.viewMode==="cal"){
    body = buildSurveyCalendarHTML(p, filtered, days);
  } else {
    var rows = filtered.slice().sort(function(a,b){return a.day-b.day||toMin(a.start)-toMin(b.start);}).map(function(s){
      var c = getCourse(s.courseId);
      var on = sv.picks.indexOf(s.id)>=0;
      return '<div class="list-row" data-act="surveyToggleSlot" data-sid="'+s.id+'" style="background:'+(on?'#EAF6F3':'transparent')+'; border-radius:8px; padding-left:8px;">' +
        '<div><div class="name">'+(on?"✅ ":"")+esc(c.name)+'</div><div class="sub">'+DAY_NAMES[s.day]+' '+s.start+'~'+s.end+' · '+fmtMoney(s.price)+'원 · 정원 '+s.cap+'명</div></div></div>';
    }).join("") || '<div class="empty">해당 조건의 과정이 없습니다</div>';
    body = '<div class="card" style="padding:4px 12px;">'+rows+'</div>';
  }

  var picksObjs = sv.picks.map(getSlot).filter(Boolean);
  var totalMoney = picksObjs.reduce(function(a,s){return a+s.price;},0);

  view.innerHTML =
  '<div class="pad" style="padding-bottom:6px;">' +
    '<div class="stepper"><div class="dot done"></div><div class="dot done"></div><div class="dot"></div></div>' +
    '<div class="day-toggles" style="margin-bottom:12px;">'+filterChips+'</div>' +
    tabHtml +
  '</div>' +
  '<div class="pad" style="padding-top:0;">'+body+
    '<label class="field">요청사항</label><textarea id="sv_memo" placeholder="선호 시간대나 요청사항을 남겨주세요">'+esc(sv.memo)+'</textarea>' +
  '</div>' +
  '<div class="bottom-fixed" style="flex-direction:column; align-items:stretch; gap:4px;">' +
    '<div class="row" style="font-size:12.5px; padding:0 2px;"><span>선택 '+sv.picks.length+'건</span><span style="font-weight:800;">'+fmtMoney(totalMoney)+'원</span></div>' +
    '<button class="btn block" '+(sv.picks.length? "" : "disabled")+' data-act="surveySubmit" data-pid="'+p.id+'">제출하기</button>' +
  '</div>';
}
function buildSurveyCalendarHTML(p, slots, days){
  var sv = state.survey;
  var calStart=p.calStart*60, calEnd=p.calEnd*60, rows=(calEnd-calStart)/ROW_MIN, dayColWidth=124, timeColWidth=56;
  var head='<div style="display:flex;"><div style="width:'+timeColWidth+'px; flex-shrink:0;"></div>'+days.map(function(d){return '<div class="cal-headcell" style="width:'+dayColWidth+'px; flex-shrink:0;">'+DAY_NAMES[d]+'</div>';}).join("")+'</div>';
  var timeLabels=''; for(var m=calStart;m<calEnd;m+=ROW_MIN){ timeLabels+='<div class="cal-timelabel" style="height:'+ROW_H+'px; line-height:'+ROW_H+'px;">'+(m%60===0?fromMin(m):'')+'</div>'; }
  var dayCols = days.map(function(d){
    var daySlots = slots.filter(function(s){return s.day===d;});
    var laid = layoutDay(daySlots);
    var blocks = laid.map(function(s){
      var c = getCourse(s.courseId);
      var on = sv.picks.indexOf(s.id)>=0;
      var top=(toMin(s.start)-calStart)/ROW_MIN*ROW_H, h=Math.max(ROW_H*0.7,(toMin(s.end)-toMin(s.start))/ROW_MIN*ROW_H);
      var w=100/s.cols, left=s.col*w;
      var titleTxt = c.name+" · 강사 "+c.instructor+" · "+DAY_NAMES[d]+" "+s.start+"~"+s.end+" · "+fmtMoney(s.price)+"원";
      return '<div class="cal-block" data-act="surveyToggleSlot" data-sid="'+s.id+'" title="'+esc(titleTxt)+'" style="top:'+top+'px; height:'+h+'px; left:calc('+left+'% + 2px); width:calc('+w+'% - 4px); background:'+c.color+'; cursor:pointer;'+(on?' outline:3px solid #16233B; outline-offset:1px;':'')+'">' +
        '<div>'+(on?"✅ ":"")+esc(c.name.split(" (")[0])+'</div><div class="sm">'+s.start+'~'+s.end+'</div></div>';
    }).join("");
    return '<div class="cal-daycol" style="width:'+dayColWidth+'px; flex-shrink:0; height:'+(rows*ROW_H)+'px;">'+blocks+'</div>';
  }).join("");
  return '<div class="cal-wrap" style="margin-bottom:14px;"><div class="cal-scroll">'+head+'<div style="display:flex;"><div class="cal-timelabels" style="width:'+timeColWidth+'px; flex-shrink:0;">'+timeLabels+'</div><div style="display:flex; position:relative;">'+dayCols+'</div></div></div></div>';
}
function surveySetFilter(f){ state.survey.filter = f; render(); }
function surveySetView(v){ state.survey.viewMode = v; render(); }
function surveyToggleSlot(sid){
  var sv = state.survey;
  var i = sv.picks.indexOf(sid);
  var memo = document.getElementById("sv_memo"); if(memo) sv.memo = memo.value;
  if(i>=0) sv.picks.splice(i,1); else sv.picks.push(sid);
  render();
}
function surveySubmit(pid){
  var sv = state.survey;
  if(!sv.picks.length){ toast("시간대를 1건 이상 선택해 주세요"); return; }
  var memo = document.getElementById("sv_memo"); if(memo) sv.memo = memo.value.trim();
  var contact = "010"+sv.c2+sv.c3;
  var payload = {
    name: sv.name, org: sv.org, years: sv.years, contact: contact,
    memo: sv.memo, picks: sv.picks.slice(), src: IS_STANDALONE ? "standalone" : "web"
  };
  if(IS_STANDALONE){
    sv.submitted = Object.assign({id:uid("rs"), programId:pid, at:now(), note:"", noteAt:""}, payload);
    sv.step = 3; render();
    return;
  }
  fetch("/api/public/"+pid+"/responses", {
    method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload)
  }).then(function(r){
    return r.json().then(function(data){ return {ok:r.ok, data:data}; });
  }).then(function(res){
    if(!res.ok){ toast(res.data.message || "제출에 실패했습니다"); return; }
    sv.submitted = res.data;
    sv.step = 3; render();
  }).catch(function(){ toast("제출 요청에 실패했습니다. 네트워크를 확인해 주세요"); });
}
function renderSurveyStep3(p, view){
  setTopbar("제출 완료");
  var sv = state.survey;
  var r = sv.submitted;
  var picks = r.picks.map(getSlot).filter(Boolean);
  var totalMoney = picks.reduce(function(a,s){return a+s.price;},0);
  var pickHtml = picks.map(function(s){
    var c = getCourse(s.courseId);
    return '<div class="list-row" style="cursor:default;"><div><div class="name">'+esc(c.name)+'</div><div class="sub">'+DAY_NAMES[s.day]+' '+s.start+'~'+s.end+' · '+fmtMoney(s.price)+'원</div></div></div>';
  }).join("");
  view.innerHTML =
  '<div class="pad">' +
    '<div class="stepper"><div class="dot done"></div><div class="dot done"></div><div class="dot done"></div></div>' +
    '<div class="card" style="text-align:center; background:var(--ok-bg); border-color:#BEE6D2;">' +
      '<div style="font-size:30px;">✅</div><div style="font-weight:800; font-size:15px; margin-top:6px;">신청이 접수되었습니다</div>' +
      (IS_STANDALONE ? '<div style="font-size:12px; color:var(--warn); margin-top:8px; font-weight:700;">⚠️ 이 배포본은 저장소를 사용하지 않습니다.<br>아래 "요약 TXT 추출"로 복사한 내용을<br>담당자에게 보내야 접수가 완료됩니다.</div>' : '') +
    '</div>' +
    '<div class="card"><div class="row"><span class="muted">선택 '+picks.length+'건</span><span style="font-weight:800;">'+fmtMoney(totalMoney)+'원</span></div></div>' +
    pickHtml +
    '<button class="btn block" style="margin-top:14px;" data-act="showSurveyExtract" data-encoded="">📄 응답서 TXT 추출</button>' +
    (IS_STANDALONE ? ('<div class="footer-note">담당자 연락처: '+esc(p.ownerTel||"-")+'</div>') : '') +
  '</div>';
}
function buildSubmittedTXT(){
  var r = state.survey.submitted;
  var p = getProgram(r.programId);
  var picks = r.picks.map(getSlot).filter(Boolean);
  var lines = [];
  lines.push("=== 교육 수요조사 응답서 ===");
  lines.push("[과정] "+p.name);
  lines.push("[이름] "+r.name);
  lines.push("[소속] "+r.org);
  lines.push("[년차] "+r.years);
  lines.push("[연락처] "+fmtContact(r.contact));
  lines.push("[제출] "+r.at);
  if(r.memo) lines.push("[요청] "+r.memo);
  lines.push("--- 선택 내역 ("+picks.length+"건) ---");
  picks.forEach(function(s,i){
    var c = getCourse(s.courseId);
    lines.push((i+1)+") "+c.name+" | "+DAY_NAMES[s.day]+" | "+s.start+"~"+s.end+" | "+fmtMoney(s.price)+"원 | "+s.id);
  });
  var total = picks.reduce(function(a,s){return a+s.price;},0);
  lines.push("[합계] "+picks.length+"건 / "+fmtMoney(total)+"원");
  lines.push("=== 응답서 끝 ===");
  return lines.join("\n");
}
function showSurveyExtract(){ showTxtPopup("응답서 TXT", buildSubmittedTXT()); }

/* ===================== 전역 클릭 위임 ===================== */
document.addEventListener("click", function(ev){
  var el = ev.target.closest("[data-act]");
  if(!el) return;
  var act = el.getAttribute("data-act");
  var pid = el.getAttribute("data-pid");
  var cid = el.getAttribute("data-cid");
  var sid = el.getAttribute("data-sid");
  var rid = el.getAttribute("data-rid");
  var iid = el.getAttribute("data-iid");
  var hash = el.getAttribute("data-hash");

  switch(act){
    case "go": go(hash); break;
    case "back": goBack(); break;
    case "resetDemo": if(confirm("데모 데이터로 초기화할까요? 현재 데이터는 사라집니다.")){ seedDemo(true); render(); } break;
    case "doLogin": doLogin(); break;
    case "logout":
      fetch("/api/logout", {method:"POST"}).catch(function(){});
      setAdmin(false); dbLoaded=false; DB=emptyDB(); go("/");
      break;
    case "closeSheet": closeSheet(); break;
    case "openInstructorSheet": openInstructorSheet(iid||null); break;
    case "saveInstructor": saveInstructor(iid||null); break;
    case "deleteInstructor": deleteInstructor(iid); break;
    case "addUnavailBlock": addUnavailBlock(); break;
    case "removeUnavailBlock": removeUnavailBlock(el.getAttribute("data-idx")); break;
    case "openProgramSheet": openProgramSheet(); break;
    case "openProgramSheet2": openProgramSheet(pid); break;
    case "saveProgram": saveProgram(pid||null); break;
    case "deleteProgram": deleteProgram(pid); break;
    case "openCourseSheet": openCourseSheet(pid, cid); break;
    case "openCourseSheet2": openCourseSheet(pid, cid); break;
    case "saveCourse": saveCourse(pid, cid||null); break;
    case "deleteCourse": deleteCourse(pid, cid); break;
    case "openSlotSheet": openSlotSheet(pid, cid, sid||null); break;
    case "saveSlot": saveSlot(pid, cid, sid||null); break;
    case "deleteSlot": deleteSlot(pid, cid, sid); break;
    case "calPreset": applyCalPreset(pid, el.getAttribute("data-preset")); break;
    case "calDayToggle": toggleCalDay(pid, +el.getAttribute("data-day")); break;
    case "calFilterAll": calFilterAll(pid); break;
    case "calFilterToggle": calFilterToggle(pid, el.getAttribute("data-cid")); break;
    case "toggleSurveyOpen": toggleSurveyOpen(pid); break;
    case "copyUrl": copyUrl(el.getAttribute("data-url")); break;
    case "exportStandaloneHTML": exportStandaloneHTML(pid); break;
    case "setRespTab": setRespTab(pid, el.getAttribute("data-tab")); break;
    case "respNav": respNav(pid, el.getAttribute("data-dir")); break;
    case "setRespIndex": setRespIndex(pid, el.getAttribute("data-idx")); break;
    case "saveRespNote": saveRespNote(pid, rid); break;
    case "deleteResponse": deleteResponse(pid, rid); break;
    case "showIndividualSummary": showIndividualSummary(pid, rid); break;
    case "showFullSummary": showFullSummary(pid); break;
    case "copyTxt": copyTxt(el.getAttribute("data-encoded")); break;
    case "downloadTxt": downloadTxt(el.getAttribute("data-name"), el.getAttribute("data-encoded")); break;
    case "openTxtRegisterSheet": openTxtRegisterSheet(pid); break;
    case "registerTxtBatch": registerTxtBatch(pid); break;
    case "exportCSV": exportCSV(pid); break;
    case "surveyStep1Next": surveyStep1Next(pid); break;
    case "surveySetFilter": surveySetFilter(el.getAttribute("data-f")); break;
    case "surveySetView": surveySetView(el.getAttribute("data-v")); break;
    case "surveyToggleSlot": surveyToggleSlot(el.getAttribute("data-sid")); break;
    case "surveySubmit": surveySubmit(pid); break;
    case "showSurveyExtract": showSurveyExtract(); break;
  }
});
document.addEventListener("click", function(ev){
  if(ev.target.id==="sheetLayer" || ev.target.classList.contains("sheet-backdrop")) closeSheet();
});
