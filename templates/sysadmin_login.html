<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시스템어드민 로그인</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;background:#16233B;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
  .box{background:#fff;padding:32px;border-radius:12px;width:280px;box-shadow:0 20px 40px rgba(0,0,0,.3);}
  h1{font-size:16px;margin:0 0 16px;color:#1D2430;}
  input{width:100%;padding:10px;margin-bottom:10px;border:1px solid #E3E6E1;border-radius:6px;box-sizing:border-box;font-size:14px;}
  button{width:100%;padding:10px;background:#0E7C7B;color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:14px;}
  .err{color:#C0392B;font-size:12px;margin-bottom:10px;}
</style>
</head>
<body>
<form class="box" method="post">
  <h1>시스템어드민 로그인</h1>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <input name="username" placeholder="아이디" autocomplete="off">
  <input name="password" type="password" placeholder="비밀번호" autocomplete="off">
  <button type="submit">로그인</button>
</form>
</body>
</html>
